services:
  redis:
    image: redis:7-alpine
    container_name: trading-advisor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: trading-advisor-postgres
    environment:
      POSTGRES_USER: trading-advisor
      POSTGRES_PASSWORD: trading-advisor
      POSTGRES_DB: trading-advisor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading-advisor"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot: runs migrations then exits. Both frontend and refresh_worker
  # depend on it completing successfully — without this, frontend only
  # waited on postgres being healthy, not on the schema actually existing
  # yet, a real startup race with no clean fix short of a dedicated service.
  migrate:
    build: .
    container_name: trading-advisor-migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://trading-advisor:trading-advisor@postgres:5432/trading-advisor
    volumes:
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # No separate `api` service (ADR-012): Reflex's own backend is the app
  # server. `frontend`'s event handlers call app/* pipeline modules
  # directly, in-process — no HTTP hop, no routers/* layer.
  #
  # KNOWN OPEN ISSUE (found during a preliminary Docker check ahead of
  # Phase 19-20's own "docker compose up" validation, not yet resolved):
  # dynamic routes (/symbols/[symbol]) 404 under `reflex run --env prod
  # --single-port` — reproduced directly against a real container; static
  # routes (/, /analyze) serve fine. Root cause not yet identified (a
  # `reflex export`/static-serving limitation with dynamic segments is
  # suspected, not confirmed). The app is fully built and verified via
  # `reflex run` (plain dev server) — this is a prod-container-serving
  # gap, not a Phase 18 UI defect. Resolve before considering Phase 19-20
  # done.
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: trading-advisor-frontend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://trading-advisor:trading-advisor@postgres:5432/trading-advisor
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ping')"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  refresh_worker:
    build: .
    container_name: trading-advisor-refresh-worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://trading-advisor:trading-advisor@postgres:5432/trading-advisor
      REDIS_URL: redis://redis:6379
    volumes:
      - ./app:/app/app
      - ./data_catalog.yaml:/app/data_catalog.yaml
    command: ["python", "-m", "app.ingest.refresh_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
