[project]
name = "trading-advisor"
version = "0.1.0"
description = "Personal market-analysis and monitoring tool. No brokerage account, no order execution."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "redis>=5.1",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "litellm>=1.52",
    "instructor>=1.6",
    "openai>=1.54",
    "anthropic>=0.39",
    "jinja2>=3.1",
    "yfinance>=0.2.44",
    "finnhub-python>=2.4.20",
    "feedparser>=6.0",
    "httpx>=0.27",
    "streamlit>=1.39",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
